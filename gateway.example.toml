# nano-agent 网关配置示例。复制成 gateway.toml 再改。
# 相对路径都以本文件所在目录为基准。
# 敏感项也可以用环境变量提供：NANO_KERNEL_TOKEN、NANO_LLM_API_KEY、
# NANO_TELEGRAM_TOKEN、NANO_FEISHU_APP_SECRET（优先于本文件）。

[kernel]
# 内核来连的地址。同机部署用 unix socket；内核在别的机器上就用 tcp，
# 并且最好走 WireGuard / Tailscale / SSH 隧道，协议本身不加密。
listen = "unix:/tmp/nano-agent.sock"
# listen = "tcp:0.0.0.0:7700"
token  = "换成一串随机字符，和 kernel.conf 里的 token 一致"

[llm]
provider = "openai"            # openai（任何 OpenAI 兼容接口）| mock（假模型，测试用）
base_url = "https://api.deepseek.com/v1"
api_key  = "sk-..."
model    = "deepseek-chat"
context_window     = 128000    # 模型的上下文窗口
max_history_tokens = 64000     # 历史的上限（估算值）。超出时一次裁掉最早的一段，裁到 trim_to 的比例
trim_to  = 0.5                 # 之后只追加不裁，请求前缀不变，模型的前缀缓存才能一直命中
timeout  = 600                 # 单次请求超时（秒）
proxy    = ""                  # "" 跟随环境变量；"none" 直连；或 "http://127.0.0.1:7890"
# temperature = 0.7
# max_tokens  = 4096
send_reasoning = false         # 把当前这一轮的推理内容回传给模型（部分推理模型需要）

# 思考强度。thinking 是默认值（空表示用模型自己的默认），每个会话可以用 /think 改。
# thinking_style 是传给模型的方式：
#   vllm   chat_template_kwargs 里的 thinking 开关和 reasoning_effort（vLLM 上的 DeepSeek、Qwen 等）
#   openai 顶层的 reasoning_effort（OpenAI 等），关闭时传 "none"
#   none   不传（默认），/think 不可用
# 注意：多数模型把思考强度写在提示词最前面，切换后这个会话的前缀缓存会失效一次。
thinking       = ""
thinking_style = "none"
# thinking_levels = ["off", "low", "high", "max"]   # /think 可选的值

# 原样合并进请求体的额外参数，比如关掉 vLLM 上模型的思考模式：
# [llm.extra]
# chat_template_kwargs = { thinking = false }

[persona]
# 人格（系统提示词）目录：default.md 是默认人格；
# 放一个 <会话ID>.md（比如 tg:-1001234567890.md）就能给某个会话单独设定。
# 改完保存，下一条消息就生效，不用重启。
dir = "personas"

[session]
data_dir = "data"              # 对话历史存在 data/sessions/ 下，每个会话一个文件
timestamps = true              # 在用户消息前加上发送时间，模型不用调工具就知道现在几点
timezone   = ""                # 时间戳的时区，比如 "Asia/Shanghai"；空表示系统时区

[access]
# 只响应这些会话（会话 ID 用 /whoami 查），空表示不限制。命令行会话总是允许。
allow_chats = []
# 管理员身份（用 /whoami 查），比如 "tg:123456789"、"feishu:ou_xxx"。命令行用户始终是管理员。
# 只有管理员能用写文件、执行命令这类工具，能改工作目录和权限模式，能审批。
admins = []
# 其他人能用的工具：none（只聊天，默认）| readonly（可以读工作目录里的文件、搜索）
guest = "none"

[workspace]
# 工具能碰到的范围。文件读写和命令都被关在沙箱里：工作目录可读写，系统目录只读，
# 其他地方（包括 HOME 里的其他东西）一律访问不了。每个会话可以用 /dir、/mode 单独改。
# 工作目录，第一个是默认目录（命令在这里执行）。要写绝对路径或 ~ 开头。
dirs = []
# 权限模式：auto 自动（工作目录内全部直接执行）| ask 审批（写文件、执行命令前要管理员批准）| readonly 只读
mode = "ask"
# 沙箱里额外只读 / 可写的路径。默认放行 git 的用户配置，让 git commit 能拿到用户名和邮箱
# extra_ro = ["~/.gitconfig", "~/.config/git"]
# extra_rw = ["~/.cargo/registry"]

[cli]
enabled = false                # 命令行聊天，本地调试用
show_reasoning = true          # 灰色显示模型的思考过程
show_usage     = true          # 每轮结束后显示用量和前缀缓存命中率

[telegram]
enabled = false
token   = ""                   # 找 @BotFather 创建机器人拿到的 token
proxy   = ""                   # 国内一般需要代理
# api_base = "https://api.telegram.org"
group_reply_all = false        # true：群里每条消息都回；false：只回 @ 或回复机器人的消息

[feishu]
enabled    = false
app_id     = ""
app_secret = ""
domain     = "feishu"          # feishu（飞书）| lark（国际版）
proxy      = ""
group_reply_all = false
