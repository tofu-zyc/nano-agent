# 推 v* 标签：先跑 CI（Linux、Windows；macOS 真机不挡发布，包照样在 Linux 上交叉编译），
# 全过才编译所有平台的包并发布到 GitHub Release。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # 只从 main 发布：大版本在 dev/<版本> 分支上做完、合并回 main 之后才打标签。
  # 开发分支上的提交被打成标签会变成“最新版本”，所有网关和内核都会自动更新上去。
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 标签必须指向 main 上的提交
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "标签 $GITHUB_REF_NAME 指向的提交不在 main 上：大版本先合并回 main 再打标签"
            exit 1
          fi

  test:
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      skip_macos: true

  release:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: 下载 zig 和 rg
        run: scripts/fetch-zig.sh && scripts/fetch-rg.sh --all
      - name: 编译发布包
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          case "$VERSION" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "标签要写成 v1.2.3：$GITHUB_REF_NAME"; exit 1 ;; esac
          make release VERSION="$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          files="$(ls *-"$VERSION"-*.tar.gz *-"$VERSION"-*.zip) install.sh install.ps1 VERSION SHA256SUMS"
          # 重跑时 Release 已经在了：覆盖上传附件
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber $files
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "nano-agent $VERSION" --generate-notes $files
          fi
