# 每次推送和 PR：Linux 上跑全部测试；Windows 和 macOS 在真机上跑各自平台的测试。
# main 是稳定分支，大版本在 dev/<版本> 分支上开发，两边都跑。发布（release.yml）也先跑这里。
name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: 下载 zig 和 rg
        run: scripts/fetch-zig.sh && scripts/fetch-rg.sh --all
      - name: make test
        run: make test
      # 网页界面检查：每个配置项都能在拓扑图的节点里找到、改了能保存（make test 里没有浏览器时跳过，这里装上再跑）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装浏览器
        run: python -m pip install playwright && python -m playwright install --with-deps chromium-headless-shell
      - name: 网页界面检查
        run: make test-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check
          path: build/ui-check/
          if-no-files-found: ignore
          retention-days: 3
      - name: 交叉编译 Windows 程序
        run: make -C kernel windows-exec windows-kernel
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bins
          path: |
            kernel/build/nano-exec.exe
            kernel/build/nano-kernel.exe
            build/tools/rg/windows-x86_64.exe
            scripts/install-kernel.ps1
          if-no-files-found: error
          retention-days: 3
      - name: 交叉编译 Windows 网关
        run: |
          mkdir -p build/windows
          cd gateway
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X nano-agent/gateway/internal/version.Version=dev" -o ../build/windows/nano-gateway.exe ./cmd/nano-gateway
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-windows
          path: build/windows/nano-gateway.exe
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-bins
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: gateway-windows
          path: gateway-win
      - name: Windows 网关程序能运行
        run: .\gateway-win\nano-gateway.exe version
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Windows 技能缓存和配套文件路径
        run: go -C gateway test ./internal/host -run 'TestPortableSkillPaths|TestSkillCacheUsesCustomHomeWithoutReplacingSource' -count=1
      - name: Windows 离线时区与安装识别
        run: |
          $env:NANO_TEST_GATEWAY_EXE = (Resolve-Path .\gateway-win\nano-gateway.exe).Path
          go -C gateway test ./cmd/nano-gateway -run 'TestOfflineWindowsIANATimezones|TestStandaloneWindowsGatewayTimezoneConfig|TestInstalledLayoutSuffixAndFileIdentity' -count=1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows NTFS 数据流、发布授权与辅助文件恢复
        run: go -C gateway test ./internal/session -run 'TestNTFS|TestAuxiliary|TestRenameAuxiliary|TestW1S23' -count=1
      - name: Windows 执行器
        run: python kernel/tests/test_exec_win.py kernel/build/nano-exec.exe build/tools/rg/windows-x86_64.exe
      - name: Windows 安装（含任务计划程序）
        env:
          NANO_TEST_SERVICE: "1"
        run: python scripts/test-install-win.py

  macos:
    runs-on: macos-14
    env:
      # macOS 默认的临时目录（/var/folders/…）很长，测试里的 unix socket 会超过 104 字节的上限
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: 内核测试
        run: make -C kernel test
      - name: 网关测试
        run: cd gateway && go test ./...
      - name: 端到端测试
        run: ./scripts/e2e.sh
