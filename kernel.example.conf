# nano-agent 内核配置示例。复制成 kernel.conf 再改。
# 每行 key = value，# 开头是注释。相对路径以本文件所在目录为基准。

# 网关地址：unix:/path 或 tcp:host:port
gateway = unix:/tmp/nano-agent.sock
# 和网关配置里 kernel.token 一致。
# 也可以不写：第一次连上网关时请求配对，在网关网页的「设备」里核对确认码、点允许后，
# 网关给这台电脑发一个专用口令，存在本文件旁边的 paired.token。别的电脑上用这种方式，不用抄口令。
token = 换成一串随机字符

# 内核的名字，默认是主机名
# node = home-pc

# 执行器 nano-exec 的路径，默认和 nano-kernel 放在同一个目录，一般不用改
# exec = /usr/local/bin/nano-exec

# 技能目录，默认是本配置文件旁的 skills/。相对路径以本配置文件所在目录为基准。
# 每个技能一个子目录，里面是带 name / description 的 SKILL.md，以及可选的脚本、资料。
# 改完下一轮自动加载；空闲时每 30 秒刷新网页列表。SSH 执行时会把用到的技能传到服务器。
# skills = skills

# 通过 SSH 在服务器上执行工具（服务器上不用跑内核）。每台一行：
#   remote = 名字 ssh目标 [服务器上 nano-exec 的路径]
# 这台机器要能免密 ssh 过去（密钥登录；~/.ssh/config 里的别名也行）。不写路径时，内核自动把执行器
# 传到服务器的 ~/.cache/nano-agent/（服务器的架构不同或 glibc 太老时，服务器有 cc 就传源码过去现编）。
# 在网关的会话设置里选这个名字，会话就在那台服务器上工作。
# remote = prod deploy@prod.example.com
# remote = lab lab-box /opt/nano-agent/nano-exec
# ssh 命令，默认 ssh
# ssh = ssh

# 每次处理最多请求几次模型（防止工具调用死循环）
max_steps = 16
# 每次处理最长多少秒
run_timeout = 600
# 等待管理员审批最长多少秒，超时按拒绝处理
approval_timeout = 300
# 工具输出最多保留多少字节，超出时保留开头和结尾、省略中间
max_output = 65536

# 管理员、工作目录、权限模式都在网关配置里设置（gateway.toml 的 [access] 和 [workspace]）。
# 注意：工作目录不能包含本文件所在的目录和 nano-exec，内核会拒绝这样的工作目录。
