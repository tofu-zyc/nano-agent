# nano-agent 内核配置示例。
# 一般用不到它：网关会在本机自己启动一个内核；别的电脑用 scripts/install-kernel.sh（或 make installer
# 生成的安装包）一键安装，配置自动写好。只有想自己手动启动内核时（网关设了 [kernel] local = false），才复制成 kernel.conf 再改。
# 每行 key = value，# 开头是注释。相对路径以本文件所在目录为基准。

# 网关地址：unix:/path 或 tcp:host:port
gateway = unix:/tmp/nano-agent.sock
# 和网关配置里 kernel.token 一致。
# 也可以不写：第一次连上网关时请求配对，在网关网页上核对确认码、点允许后，
# 网关给这台电脑发一个专用口令，存在本文件旁边的 paired.token。别的电脑上用这种方式，不用抄口令。
token = 换成一串随机字符

# 内核的名字，默认是主机名
# node = home-pc

# 执行器 nano-exec 的路径，默认和 nano-kernel 放在同一个目录，一般不用改
# exec = /usr/local/bin/nano-exec

# 每条消息最多请求模型几次、最长多久、等审批多久、工具输出保留多少，都在网关网页的拓扑图里设置，
# 网关每一轮都带给内核。下面几项只在连着旧版本网关（不带这些设置）时兜底，一般不用写：
# max_steps = 16
# run_timeout = 600
# approval_timeout = 300
# max_output = 65536

# ---- 本机的执行能力与限额（部署方设定，网关只能更严不能更松） ----
# 同一台机器上同时跑几个执行器、其中最多几个 Shell、还没结束的任务总数上限
# max_execs = 8
# max_parallel_shells = 2
# max_live_jobs = 16
# 受管理/流式命令的最大执行秒数；默认 86400，0 明确允许请求不限时（仍受 run 预算约束）
# max_job_timeout = 86400
# 同时活跃的 run、每个 run 同时跑几个工具
# max_active_runs = 16
# max_parallel_tools = 4

# 执行隔离的请求模式（和审批策略分开）：
#   auto：用这台机器上可用的隔离，没有完整隔离时保留旧行为（自动模式下的 Shell 要审批）
#   on  ：要求完整隔离；这台机器没有可用的 Landlock 时启动就失败，不静默降级
#   off ：明确跳过 Landlock / seccomp / no_new_privs，按当前系统用户身份执行。
#         文件工具的路径权限和审批规则照旧，但任意 Shell 的实际文件访问不再受这些规则约束
# sandbox = auto

# 管理员、工作目录、权限模式、技能都在网关里设置。SSH 服务器由网关自己连（网页“设备”），内核不管。
# 注意：工作目录不能包含本文件所在的目录和 nano-exec，内核会拒绝这样的工作目录。
