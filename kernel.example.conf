# nano-agent 内核配置示例。复制成 kernel.conf 再改。
# 每行 key = value，# 开头是注释。相对路径以本文件所在目录为基准。

# 网关地址：unix:/path 或 tcp:host:port
gateway = unix:/tmp/nano-agent.sock
# 和网关配置里 kernel.token 一致
token = 换成一串随机字符

# 内核的名字，默认是主机名
# node = home-pc

# 工具目录，每个子目录一个工具
tools_dir = tools

# 每次处理最多请求几次模型（防止工具调用死循环）
max_steps = 16
# 每次处理最长多少秒
run_timeout = 600
# 等待管理员审批最长多少秒，超时按拒绝处理
approval_timeout = 300
# 工具输出最多保留多少字节，超出截断
max_output = 65536

# 管理员身份，可以写多行。身份在聊天里发 /whoami 查看。
# 只有管理员能用 allow = "admin" 的工具，也只有管理员能审批。
admin = cli:local
# admin = tg:123456789
# admin = feishu:ou_xxxxxxxxxxxxxxxx
