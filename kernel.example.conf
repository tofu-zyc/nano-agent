# nano-agent 内核配置示例。
# 一般用不到它：网关会在本机自己启动一个内核；别的电脑用 scripts/install-kernel.sh（或 make installer
# 生成的安装包）一键安装，配置自动写好。只有想自己手动启动内核时（网关设了 [kernel] local = false），才复制成 kernel.conf 再改。
# 每行 key = value，# 开头是注释。相对路径以本文件所在目录为基准。

# 网关地址：unix:/path 或 tcp:host:port
gateway = unix:/tmp/nano-agent.sock
# 和网关配置里 kernel.token 一致。
# 也可以不写：第一次连上网关时请求配对，在网关网页的「设备」里核对确认码、点允许后，
# 网关给这台电脑发一个专用口令，存在本文件旁边的 paired.token。别的电脑上用这种方式，不用抄口令。
token = 换成一串随机字符

# 内核的名字，默认是主机名
# node = home-pc

# 执行器 nano-exec 的路径，默认和 nano-kernel 放在同一个目录，一般不用改
# exec = /usr/local/bin/nano-exec

# 每次处理最多请求几次模型（防止工具调用死循环）
max_steps = 16
# 每次处理最长多少秒
run_timeout = 600
# 等待管理员审批最长多少秒，超时按拒绝处理
approval_timeout = 300
# 工具输出最多保留多少字节，超出时保留开头和结尾、省略中间
max_output = 65536

# 管理员、工作目录、权限模式、技能都在网关里设置。SSH 服务器由网关自己连（网页“设备”），内核不管。
# 注意：工作目录不能包含本文件所在的目录和 nano-exec，内核会拒绝这样的工作目录。
